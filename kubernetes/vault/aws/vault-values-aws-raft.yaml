global:
  enabled: true
  tlsDisable: true

injector:
  enabled: true

server:
  # HA mode with Raft
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        # AWS KMS Auto-Unseal
        seal "awskms" {
          region     = "ap-south-2"
          kms_key_id = "alias/vault-unseal"
        }

        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 1Gi

  extraSecretEnvironmentVars:
    - envName: AWS_ACCESS_KEY_ID
      secretName: vault-aws-creds
      secretKey: AWS_ACCESS_KEY_ID
    - envName: AWS_SECRET_ACCESS_KEY
      secretName: vault-aws-creds
      secretKey: AWS_SECRET_ACCESS_KEY

  # Production security hardening
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

ui:
  enabled: true
  serviceType: NodePort
